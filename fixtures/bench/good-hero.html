<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments</title><style>body{font:16px/1.5 Georgia,serif;margin:0;color:#1b1b1b;background:#fff}main{max-width:960px;margin:0 auto;padding:24px}h1{font-size:40px;margin:0 0 16px}h2{font-size:28px;margin:32px 0 16px}p{margin:0 0 16px}a{color:#0b4f8a}button{font:inherit;padding:12px 16px;min-height:44px}.hero{display:grid;margin-bottom:16px}.hero h1{grid-area:1/1;margin:0}.hero .glow{color:transparent;background:linear-gradient(90deg,#635bff,#00d4ff);-webkit-background-clip:text;background-clip:text}.fl{position:relative;margin-top:24px}.fl label{position:absolute;top:12px;left:12px;color:#555}.fl input{position:relative;width:100%;max-width:280px;box-sizing:border-box;min-height:44px;font:inherit;padding:12px;background:#fff0;border:1px solid #777}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style></head><body><main><div class="hero"><h1>Financial infrastructure to grow your revenue</h1><h1 class="glow" aria-hidden="true">Financial infrastructure to grow your revenue</h1></div><p>Accept payments in 135 currencies.</p><form class="fl"><label for="em">Enter your email</label><input id="em" type="email"><span class="sr">We never share your address with anyone else at all</span><button>Start now</button></form></main></body></html>
