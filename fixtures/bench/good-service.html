<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renew a passport</title><style>body{font:16px/1.5 Georgia,serif;margin:0;color:#1b1b1b;background:#fff}main{max-width:960px;margin:0 auto;padding:24px}h1{font-size:40px;margin:0 0 16px}h2{font-size:28px;margin:32px 0 16px}p{margin:0 0 16px}a{color:#0b4f8a}button{font:inherit;padding:12px 16px;min-height:44px}</style></head><body><header><nav aria-label="Main"><a href="/">Home</a> <a href="/help">Help</a></nav></header><main><h1>Renew or replace your adult passport</h1><p>It costs £88.50 to renew online, or £100 by post.</p><h2>Before you start</h2><p>You'll need your old passport and a digital photo.</p><form><label for="dob">Date of birth</label><p id="dob-hint">For example, 27 3 2007</p><input id="dob" aria-describedby="dob-hint" style="display:block;font:inherit;padding:12px;min-height:44px"><button type="submit">Continue</button></form><h2>Contact</h2><p>Phone 0300 222 0000, Monday to Friday, 8am to 8pm.</p></main><footer><p>© Crown copyright</p></footer></body></html>
