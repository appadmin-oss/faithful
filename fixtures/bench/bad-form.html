<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing settings</title><style>body{font:16px/1.5 Georgia,serif;margin:0;color:#1b1b1b;background:#fff}main{max-width:960px;margin:0 auto;padding:24px}h1{font-size:40px;margin:0 0 16px}label{display:block;font-weight:bold;margin:0 0 6px}input,select{font:inherit;padding:8px;min-height:44px;box-sizing:border-box;border:2px solid #0b0c0c}.f{margin:0 0 28px}button{font:inherit;padding:12px 16px;min-height:44px}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}.g input,.g select{width:100%}</style></head><body><main><h1>Pricing</h1><form><details><summary>Programme prices</summary><div class="g"><div><label for="a">Certificate base ($)</label><input id="a" type="number" value="130"></div><div><label for="b">Diploma base ($)</label><input id="b" type="number" value="180"></div><div><label for="c">Online surcharge (%)</label><input id="c" type="number" value="20"></div><div><label for="d">Registration fee ($)</label><input id="d" type="number" value="5"></div><div><label for="e">Auto-invoice</label><select id="e"><option>Yes</option><option>No</option></select></div><div><label for="g">Due days</label><input id="g" type="number" value="14"></div></div></details><button>Save</button></form></main></body></html>
