<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing settings</title><style>body{font:16px/1.5 Georgia,serif;margin:0;color:#1b1b1b;background:#fff}main{max-width:960px;margin:0 auto;padding:24px}h1{font-size:40px;margin:0 0 16px}label{display:block;font-weight:bold;margin:0 0 6px}input,select{font:inherit;padding:8px;min-height:44px;box-sizing:border-box;border:2px solid #0b0c0c}.f{margin:0 0 28px}button{font:inherit;padding:12px 16px;min-height:44px}.w4{width:9ch}.w2{width:6ch}.sfx{margin-left:8px}</style></head><body><main><h1>Pricing</h1><form><div class="f"><label for="a">Certificate base price</label><span>$</span><input id="a" class="w4" type="number" value="130"></div><div class="f"><label for="c">Online surcharge</label><input id="c" class="w2" type="number" value="20"><span class="sfx">%</span></div><div class="f"><label for="e">Invoice automatically</label><select id="e"><option>Yes</option><option>No</option></select></div><details><summary>Help with prices</summary><p>Prices are in US dollars and convert at the day's rate.</p></details><button>Save</button></form></main></body></html>
